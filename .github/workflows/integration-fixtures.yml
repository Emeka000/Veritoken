name: Integration fixtures

on:
  pull_request:
    paths:
      - ".github/workflows/integration-fixtures.yml"
      - "contracts/**"
      - "tests/integration/**"
  push:
    paths:
      - ".github/workflows/integration-fixtures.yml"
      - "contracts/**"
      - "tests/integration/**"
  workflow_dispatch:

concurrency:
  group: integration-fixtures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-unit-tests:
    name: Fixture unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/integration
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/integration/package-lock.json

      - name: Install integration dependencies
        run: npm ci

      - name: Type-check fixture harness
        run: npm run typecheck

      - name: Run fixture and failure-path tests
        run: npm run test:unit

  lifecycle-tests:
    name: Local-network lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-fixture-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-fixture-cargo-

      - name: Build contract WASMs
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Start Stellar Quickstart
        run: docker compose up -d stellar

      - name: Wait for Stellar RPC
        shell: bash
        run: |
          container_id="$(docker compose ps -q stellar)"
          for attempt in {1..60}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' "$container_id")"
            if [[ "$status" == "healthy" ]]; then
              exit 0
            fi
            sleep 3
          done
          docker compose logs stellar
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/integration/package-lock.json

      - name: Install integration dependencies
        working-directory: tests/integration
        run: npm ci

      - name: Run isolated lifecycle tests
        working-directory: tests/integration
        run: npm run test:lifecycle

      - name: Print Quickstart logs after a failure
        if: failure()
        run: docker compose logs stellar

      - name: Stop Quickstart
        if: always()
        run: docker compose down --volumes
