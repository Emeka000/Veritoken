name: E2E

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: "Playwright E2E (Chromium)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # ── Contract WASMs ─────────────────────────────────────────────────────
      - name: Download WASM artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          workflow_conclusion: success
          commit: ${{ github.event.pull_request.head.sha }}
          name: wasm-release
          path: target/wasm32v1-none/release/
        continue-on-error: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-e2e-

      - name: Build WASMs (fallback if artifact download failed)
        shell: bash
        run: |
          shopt -s nullglob
          wasm_files=(target/wasm32v1-none/release/*.wasm)
          if [ "${#wasm_files[@]}" -eq 0 ]; then
            echo "No WASMs found from artifact download — building locally."
            cargo build --target wasm32v1-none --release \
              -p kyc-registry -p compliance-engine -p rwa-token \
              -p invoice-token -p property-token -p carbon-credit-token
          else
            echo "Using ${#wasm_files[@]} downloaded WASM artifact(s)."
          fi

      # ── Node / npm dependencies ────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            tests/integration/package-lock.json
            tests/e2e/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install integration fixture dependencies
        # tests/e2e/global-setup.ts imports tests/integration/fixtures/*.ts
        # directly (fixture-plans.ts, fixture-runner.ts, soroban-transport.ts)
        # to reuse the same deploy plans/transport as the integration suite.
        working-directory: tests/integration
        run: npm ci

      - name: Install E2E test dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      # ── Run the suite ──────────────────────────────────────────────────────
      # global-setup.ts starts the standalone node, deploys contracts, writes
      # frontend/.env.e2e.local, and only then starts `vite --mode e2e`
      # itself — see the comment at the top of tests/e2e/global-setup.ts.
      - name: Run Playwright E2E suite
        working-directory: tests/e2e
        # playwright.config.ts switches to [github, html, junit] reporters
        # when CI is set — no --reporter flag needed here.
        run: npx playwright test
        env:
          CI: "true"

      # ── Artifacts ───────────────────────────────────────────────────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7

      - name: Upload failure screenshots/traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: tests/e2e/test-results/
          retention-days: 7

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-junit-results
          path: tests/e2e/test-results/e2e.xml
          retention-days: 7

      - name: Print standalone node logs on failure
        if: failure()
        run: docker logs veritoken-e2e-standalone || true

      - name: Stop standalone node
        if: always()
        run: docker rm --force --volumes veritoken-e2e-standalone || true
