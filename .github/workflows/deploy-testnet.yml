name: Deploy — Testnet

on:
  push:
    branches: [main, master]

concurrency:
  group: deploy-testnet
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit the manifest back to the repo
  statuses: write   # needed to post commit status checks

jobs:
  deploy-testnet:
    name: "Deploy to Testnet"
    runs-on: ubuntu-latest
    environment: testnet
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so we can push the manifest commit
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Download WASMs from the build workflow ────────────────────────────────
      - name: Download WASM artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          workflow_conclusion: success
          commit: ${{ github.sha }}
          name: wasm-release
          path: target/wasm32v1-none/release/
        continue-on-error: true

      # ── Rebuild locally if artifacts are not available ────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-testnet-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-testnet-

      - name: Build WASMs (fallback)
        shell: bash
        run: |
          shopt -s nullglob
          wasm_files=(target/wasm32v1-none/release/*.wasm)
          if [ "${#wasm_files[@]}" -eq 0 ]; then
            echo "No cached WASMs found — building locally."
            cargo build --target wasm32v1-none --release \
              -p kyc-registry -p compliance-engine -p rwa-token \
              -p invoice-token -p property-token -p carbon-credit-token
          fi

      # ── Setup Node for deployment script ─────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: deployment/scripts/package-lock.json

      - name: Install deployment script dependencies
        working-directory: deployment/scripts
        run: npm ci

      # ── Verify deployer account balance ──────────────────────────────────────
      - name: Check deployer account is funded
        working-directory: deployment/scripts
        env:
          DEPLOYER_SECRET: ${{ secrets.TESTNET_DEPLOYER_SECRET }}
          STELLAR_NETWORK: testnet
          STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          STELLAR_NETWORK_PASSPHRASE: Test SDF Network ; September 2015
        run: npx tsx check-funded.ts

      # ── Run deployment script ─────────────────────────────────────────────────
      - name: Deploy contracts to Testnet
        id: deploy
        working-directory: deployment/scripts
        env:
          DEPLOYER_SECRET: ${{ secrets.TESTNET_DEPLOYER_SECRET }}
          STELLAR_NETWORK: testnet
          STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          STELLAR_NETWORK_PASSPHRASE: Test SDF Network ; September 2015
          WASM_DIR: ${{ github.workspace }}/target/wasm32v1-none/release
          CONFIG_FILE: ${{ github.workspace }}/deployment/config.testnet.json
          MANIFEST_OUT: ${{ github.workspace }}/deployment/manifests/testnet-${{ github.sha }}.json
        run: npx tsx deploy.ts

      # ── Smoke tests against deployed contract IDs ─────────────────────────────
      - name: Run smoke tests against deployed contracts
        env:
          STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          STELLAR_NETWORK_PASSPHRASE: Test SDF Network ; September 2015
          MANIFEST_FILE: ${{ github.workspace }}/deployment/manifests/testnet-${{ github.sha }}.json
        run: |
          cargo test --package smoke-tests -- --test-threads=1

      # ── Commit manifest back to repository ───────────────────────────────────
      - name: Commit testnet manifest
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployment/manifests/testnet-${{ github.sha }}.json
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
          else
            git commit -m "chore(deploy): testnet manifest for ${{ github.sha }}"
            git push origin HEAD:${{ github.ref_name }}
          fi

      # ── Post failure status check ─────────────────────────────────────────────
      - name: Post failure commit status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Testnet deployment failed — see Actions run for details.',
              context: 'deploy/testnet',
            });
