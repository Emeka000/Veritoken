name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

# ── Job overview ───────────────────────────────────────────────────────────────
#
#  rust-fmt        — cargo fmt check
#  rust-clippy     — cargo clippy (all targets, all features)
#  rust-test       — cargo test (unit + integration, features=testutils)
#  rust-wasm       — release WASM build + size check + artifact verification
#  frontend-lint   — ESLint
#  frontend-build  — TypeScript type-check + Vite build
#  frontend-test   — Vitest unit tests
#  drift-check     — env drift detection (requires deployed manifest)
#
#  All rust-* jobs share a single Cargo cache keyed on Cargo.lock.
#  frontend-* jobs share a Node module cache keyed on package-lock.json.

jobs:
  # ── Rust: format ────────────────────────────────────────────────────────────
  rust-fmt:
    name: "Rust · fmt"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # ── Rust: clippy ────────────────────────────────────────────────────────────
  rust-clippy:
    name: "Rust · clippy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Rust: tests ─────────────────────────────────────────────────────────────
  rust-test:
    name: "Rust · test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo test
        run: cargo test --all --features testutils

  # ── Rust: WASM build + artifact verification ────────────────────────────────
  rust-wasm:
    name: "Rust · wasm build + artifact verification"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-

      - name: Fuzz / property-based tests
        run: cargo test -p fuzz-tests --features testutils

      - name: Dividend regression tests
        run: cargo test -p dividend-regression-tests --features testutils

      - name: Cross-contract integration tests
        run: cargo test -p integration-tests --features testutils

      - name: Build WASM (release)
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Verify artifacts (existence, magic bytes, size bounds)
        shell: bash
        run: bash scripts/verify-artifacts.sh

      - name: Check WASM sizes against CI threshold
        shell: bash
        run: |
          # ── Configurable threshold ─────────────────────────────────────────
          THRESHOLD_BYTES=131072   # 128 KB

          WASM_DIR="target/wasm32-unknown-unknown/release"
          EXIT_CODE=0

          echo "──────────────────────────────────────────────"
          echo " WASM binary size report (threshold: $((THRESHOLD_BYTES / 1024)) KB)"
          echo "──────────────────────────────────────────────"
          printf "%-52s %10s  %s\n" "File" "Size (bytes)" "Status"
          echo "──────────────────────────────────────────────"

          for wasm in "$WASM_DIR"/*.wasm; do
            [ -f "$wasm" ] || continue
            SIZE=$(wc -c < "$wasm")
            NAME=$(basename "$wasm")
            SIZE_KB=$(echo "scale=1; $SIZE / 1024" | bc)

            if [ "$SIZE" -gt "$THRESHOLD_BYTES" ]; then
              STATUS="❌ EXCEEDS LIMIT (${SIZE_KB} KB > $((THRESHOLD_BYTES / 1024)) KB)"
              EXIT_CODE=1
            else
              STATUS="✅ OK (${SIZE_KB} KB)"
            fi

            printf "%-52s %10d  %s\n" "$NAME" "$SIZE" "$STATUS"
          done

          echo "──────────────────────────────────────────────"

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo ""
            echo "ERROR: One or more WASM binaries exceed the ${THRESHOLD_BYTES}-byte ($(( THRESHOLD_BYTES / 1024 )) KB) size limit."
            echo "Consider:"
            echo "  • Removing unused dependencies"
            echo "  • Ensuring opt-level = 'z' and lto = true in [profile.release]"
            echo "  • Running: wasm-opt -Oz <file>.wasm -o <file>.wasm"
          fi

          exit "$EXIT_CODE"

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-release
          path: target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 7

  # ── Frontend: lint ───────────────────────────────────────────────────────────
  frontend-lint:
    name: "Frontend · lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  # ── Frontend: build (type-check + Vite) ─────────────────────────────────────
  frontend-build:
    name: "Frontend · type-check & build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build

  # ── Frontend: tests ──────────────────────────────────────────────────────────
  frontend-test:
    name: "Frontend · test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  # ── Drift detection ──────────────────────────────────────────────────────────
  # Compares frontend/.env against the committed deploy-manifest.json.
  # This job is advisory on PRs (continue-on-error: true) but must pass on
  # pushes to main/master where a manifest is expected to exist.
  drift-check:
    name: "Config · drift detection"
    runs-on: ubuntu-latest
    # Run after the WASM build so that any manifest written by CI is available.
    needs: [rust-wasm]
    # Allow this job to fail on PRs where no manifest has been committed yet.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for env / contract ID drift
        shell: bash
        run: |
          if [[ ! -f "deploy-manifest.json" ]]; then
            echo "No deploy-manifest.json found — skipping drift check."
            echo "Commit a manifest by running: bash scripts/deploy.sh <identity>"
            exit 0
          fi
          bash scripts/check-drift.sh --check-only
