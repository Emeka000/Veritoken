name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust checks ────────────────────────────────────────────────────────────
  rust:
    name: Rust (fmt / clippy / test / wasm)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Veritoken/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Veritoken/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt
        working-directory: Veritoken
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: Veritoken
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        working-directory: Veritoken
        run: cargo test --all

      - name: Fuzz / property-based tests
        working-directory: Veritoken
        run: cargo test -p fuzz-tests --features testutils

      - name: Dividend regression tests
        working-directory: Veritoken
        run: cargo test -p dividend-regression-tests --features testutils

      - name: Cross-contract integration tests
        working-directory: Veritoken
        run: cargo test -p integration-tests --features testutils

      - name: Build WASM (release)
        working-directory: Veritoken
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Check WASM sizes
        working-directory: Veritoken
        shell: bash
        # Per-contract budgets are documented in docs/contract-size-budget.md.
        # To update a budget: edit scripts/check-wasm-size.sh and that doc, then PR.
        run: bash scripts/check-wasm-size.sh

  # ── Frontend checks ────────────────────────────────────────────────────────
  frontend:
    name: Frontend (lint / build / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Veritoken/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Veritoken/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check & build
        run: npm run build

      - name: Test
        run: npm test
