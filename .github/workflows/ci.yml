name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust checks ────────────────────────────────────────────────────────────
  rust:
    name: Rust (fmt / clippy / test / wasm)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Veritoken/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Veritoken/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt
        working-directory: Veritoken
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: Veritoken
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        working-directory: Veritoken
        run: cargo test --all

      - name: Build WASM (release)
        working-directory: Veritoken
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Check WASM sizes
        working-directory: Veritoken
        shell: bash
        run: |
          # ── Configurable threshold ────────────────────────────────────────
          THRESHOLD_BYTES=131072   # 128 KB

          WASM_DIR="target/wasm32-unknown-unknown/release"
          EXIT_CODE=0

          echo "──────────────────────────────────────────────"
          echo " WASM binary size report (threshold: $((THRESHOLD_BYTES / 1024)) KB)"
          echo "──────────────────────────────────────────────"
          printf "%-52s %10s  %s\n" "File" "Size (bytes)" "Status"
          echo "──────────────────────────────────────────────"

          for wasm in "$WASM_DIR"/*.wasm; do
            [ -f "$wasm" ] || continue
            SIZE=$(wc -c < "$wasm")
            NAME=$(basename "$wasm")
            SIZE_KB=$(echo "scale=1; $SIZE / 1024" | bc)

            if [ "$SIZE" -gt "$THRESHOLD_BYTES" ]; then
              STATUS="❌ EXCEEDS LIMIT (${SIZE_KB} KB > $((THRESHOLD_BYTES / 1024)) KB)"
              EXIT_CODE=1
            else
              STATUS="✅ OK (${SIZE_KB} KB)"
            fi

            printf "%-52s %10d  %s\n" "$NAME" "$SIZE" "$STATUS"
          done

          echo "──────────────────────────────────────────────"

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo ""
            echo "ERROR: One or more WASM binaries exceed the ${THRESHOLD_BYTES}-byte ($(( THRESHOLD_BYTES / 1024 )) KB) size limit."
            echo "Consider:"
            echo "  • Removing unused dependencies"
            echo "  • Ensuring opt-level = 'z' and lto = true in [profile.release]"
            echo "  • Running: wasm-opt -Oz <file>.wasm -o <file>.wasm"
          fi

          exit "$EXIT_CODE"

  # ── Frontend checks ────────────────────────────────────────────────────────
  frontend:
    name: Frontend (lint / build / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Veritoken/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Veritoken/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check & build
        run: npm run build

      - name: Test
        run: npm test
