name: Build

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust: WASM build matrix ──────────────────────────────────────────────────
  rust-wasm:
    name: "Rust · wasm (${{ matrix.contract }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        contract:
          - kyc-registry
          - compliance-engine
          - invoice-token
          - property-token
          - carbon-credit-token
          - rwa-token
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ matrix.contract }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-${{ matrix.contract }}-

      - name: Build WASM (release) — ${{ matrix.contract }}
        run: cargo build --target wasm32v1-none --release -p ${{ matrix.contract }}

      - name: Upload WASM artifact — ${{ matrix.contract }}
        uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.contract }}
          path: target/wasm32v1-none/release/*.wasm
          retention-days: 7

  # ── Merge all per-contract WASMs into a single artifact ──────────────────────
  collect-wasm-artifacts:
    name: "Rust · collect WASM artifacts"
    runs-on: ubuntu-latest
    needs: rust-wasm
    steps:
      - name: Download all WASM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wasm-*
          merge-multiple: true
          path: wasm-release/

      - name: Upload merged WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-release
          path: wasm-release/*.wasm
          retention-days: 7

  # ── Rust: unit tests ─────────────────────────────────────────────────────────
  rust-test:
    name: "Rust · unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: cargo test (unit)
        run: cargo test --workspace --exclude fuzz-tests --exclude dividend-regression-tests --exclude integration-tests

  # ── Rust: clippy ─────────────────────────────────────────────────────────────
  rust-clippy:
    name: "Rust · clippy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32v1-none

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-

      - name: cargo clippy -- -D warnings
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Frontend: install, build, test ───────────────────────────────────────────
  frontend:
    name: "Frontend · ci / build / test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm run build
        run: npm run build

      - name: npm run test
        run: npm run test
